plugins { id 'com.android.library' version '8.6.1' }

// Godot Android plugin (v2) bridging Yandex Mobile Ads to GDScript as the
// "SlipstreamAds" singleton. Ported from the Last Hook project's LastHookAds
// module without AppMetrica and interstitials. Build with
// tools/prepare_android_build.ps1 -RebuildPlugin.
android {
    namespace 'com.slipstream.ads'
    compileSdk 36
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly files('../../godot/android/build/libs/debug/godot-lib.template_debug.aar')
    implementation 'com.yandex.android:mobileads:8.6.0'
}

tasks.register('installPlugin', Copy) {
    dependsOn 'assembleRelease'
    from('build/outputs/aar/SlipstreamAds-release.aar')
    into('../../godot/addons/slipstream_ads/bin')
    rename { 'SlipstreamAds.aar' }
}
